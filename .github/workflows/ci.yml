name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser to run the cross-browser smoke suite against"
        required: true
        default: "all"
        type: choice
        options:
          - chrome
          - firefox
          - edge
          - all

jobs:
  smoke-tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: demoqa-automation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('demoqa-automation/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Start Healenium infrastructure (docker compose up)
        working-directory: .
        run: docker compose up -d

      - name: Wait for healenium-backend to accept connections
        working-directory: .
        run: |
          echo "Waiting for healenium-backend on localhost:7878..."
          for i in $(seq 1 40); do
            if curl -s -o /dev/null http://localhost:7878; then
              echo "healenium-backend is accepting connections after ${i} attempt(s)."
              exit 0
            fi
            echo "Not ready yet (attempt $i/40), retrying in 3s..."
            sleep 3
          done
          echo "::error::healenium-backend did not start accepting connections within the timeout"
          docker compose logs
          exit 1

      - name: Run smoke suite (headless Chrome)
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: mvn test -Dsuite.file=testng-smoke -Dheadless=true

      - name: Stop Healenium infrastructure (docker compose down)
        if: always()
        working-directory: .
        run: docker compose down -v

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: demoqa-automation/target/allure-results
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Extent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: demoqa-automation/test-output/ExtentReport.html
          if-no-files-found: warn
          retention-days: 30

      - name: Write test summary
        if: always()
        run: |
          RESULTS_FILE="target/surefire-reports/testng-results.xml"
          if [ -f "$RESULTS_FILE" ]; then
            TOTAL=$(grep -oP 'total="\K[0-9]+' "$RESULTS_FILE" || echo "?")
            PASSED=$(grep -oP 'passed="\K[0-9]+' "$RESULTS_FILE" || echo "?")
            FAILED=$(grep -oP 'failed="\K[0-9]+' "$RESULTS_FILE" || echo "?")
            SKIPPED=$(grep -oP 'skipped="\K[0-9]+' "$RESULTS_FILE" || echo "?")

            {
              echo "### Smoke Suite Results"
              echo ""
              echo "| Total | Passed | Failed | Skipped |"
              echo "|-------|--------|--------|---------|"
              echo "| $TOTAL | $PASSED | $FAILED | $SKIPPED |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Smoke Suite Results" >> "$GITHUB_STEP_SUMMARY"
            echo "No test results file found — the build likely failed before tests ran." >> "$GITHUB_STEP_SUMMARY"
          fi

  cross-browser-smoke:
    name: Cross-browser smoke suite (manual, ${{ matrix.browser }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event.inputs.browser == 'all' && fromJSON('["chrome","firefox","edge"]') || fromJSON(format('["{0}"]', github.event.inputs.browser)) }}

    defaults:
      run:
        working-directory: demoqa-automation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('demoqa-automation/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Start Healenium infrastructure (docker compose up)
        working-directory: .
        run: docker compose up -d

      - name: Wait for healenium-backend to accept connections
        working-directory: .
        run: |
          echo "Waiting for healenium-backend on localhost:7878..."
          for i in $(seq 1 40); do
            if curl -s -o /dev/null http://localhost:7878; then
              echo "healenium-backend is accepting connections after ${i} attempt(s)."
              exit 0
            fi
            echo "Not ready yet (attempt $i/40), retrying in 3s..."
            sleep 3
          done
          echo "::error::healenium-backend did not start accepting connections within the timeout"
          docker compose logs
          exit 1

      - name: Run smoke suite (headless ${{ matrix.browser }})
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: mvn test -Dsuite.file=testng-smoke -Dheadless=true -Dbrowser=${{ matrix.browser }}

      - name: Stop Healenium infrastructure (docker compose down)
        if: always()
        working-directory: .
        run: docker compose down -v

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: demoqa-automation/target/allure-results
          if-no-files-found: warn
          retention-days: 30

  publish-allure-report:
    name: Publish Allure report to GitHub Pages
    needs: smoke-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.smoke-tests.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: demoqa-automation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('demoqa-automation/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: demoqa-automation/target/allure-results

      - name: Generate Allure HTML report
        run: mvn io.qameta.allure:allure-maven:report

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demoqa-automation/target/site/allure-maven-plugin

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
